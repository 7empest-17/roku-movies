name: Actualizar Feed Roku

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Google Chrome y Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Instalar dependencias Python
        run: |
          pip install seleniumbase beautifulsoup4 requests

      - name: Ejecutar Extractor con Bypass UC
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python generar_feed_roku.py

      - name: Guardar y subir feed actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_roku.json
          git commit -m "Auto-update feed Roku" || exit 0
          git push
